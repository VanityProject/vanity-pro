[package]
name = "vanity-pro"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Offline multi-chain vanity wallet generator with public-only CPU and OpenCL workers"

[[bin]]
name = "vanity"
path = "src/main.rs"

[[bin]]
name = "VanityPro"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]
developer-tools = ["dep:curve25519-dalek"]

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
bech32 = "0.11.0"
bs58 = "0.5.1"
chacha20poly1305 = "0.10.1"
data-encoding = "2.9.0"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"], optional = true }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "expose-field", "std"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
ripemd = "0.1.3"
aes = { version = "0.8", features = ["zeroize"] }
clap = { version = "4.5", features = ["derive"] }
ctr = "0.9"
ctrlc = "3.4"
fs2 = "0.4"
getrandom = "0.3"
hex = "0.4"
opencl3 = "0.12"
pbkdf2 = "0.12"
rpassword = "7.3"
scrypt = "0.11"
secp256k1 = { version = "0.31", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.20"
tiny-keccak = { version = "2.0", features = ["keccak"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"], optional = true }
rfd = { version = "=0.17.2", default-features = false, optional = true }

[build-dependencies]
winresource = "0.1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.6"

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = { version = "=0.36.2", default-features = false, features = ["eframe"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep optimized test behavior without linking every test binary with release LTO.
# Distribution executables still use the unchanged release profile above.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
